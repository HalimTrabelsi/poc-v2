services:

  # ═══════════════════════════════════════════════════════════
  # MLflow — Model Tracking & Visualization
  # ═══════════════════════════════════════════════════════════

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlruns/mlflow.db
    volumes:
      - mlflow-data:/mlflow
    environment:
      MLFLOW_TRACKING_URI: http://localhost:5000
    networks:
      - openg2p-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════════════════════
  #  OpenG2P — Services  
  # ═══════════════════════════════════════════════════════════

  postgresql:
    image: postgres:15.6
    container_name: openg2p-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openg2p}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-openg2p}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - openg2p-internal

  spar-mapper-api:
    build:
      context: ./openg2p-spar
      dockerfile: Dockerfile.mapper
    container_name: openg2p-spar-mapper-api
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - openg2p-internal

  spar-bene-portal-api:
    build:
      context: ./openg2p-spar
      dockerfile: Dockerfile.bene-portal
    container_name: openg2p-spar-bene-portal-api
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - openg2p-internal

  openg2p-odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo
    image: openg2p-odoo-stable:17.0
    container_name: openg2p-odoo
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      ODOO_DATABASE_HOST: postgresql
      ODOO_DATABASE_NAME: ${POSTGRES_DB:-openg2p}
      ODOO_DATABASE_USER: ${POSTGRES_USER:-odoo}
      ODOO_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      ODOO_LOAD_DEMO_DATA: "no"
      ODOO_SKIP_MODULES_UPDATE: "yes"
      ODOO_ADDONS_PATH: "/opt/bitnami/odoo/addons,/opt/bitnami/odoo/extra-addons"
      ODOO_ADMIN_PASSWORD: admin
      DASHBOARD_TOKEN_SECRET: ${DASHBOARD_TOKEN_SECRET:?set in .env}
    volumes:
      - odoo-data:/bitnami/odoo
      # Bind-mounted so source edits made on the host survive a container
      # recreation instead of silently reverting to the last image build —
      # the same class of bug that repeatedly wiped fraud-engine fixes.
      #
      # MUST target /opt/bitnami/odoo/extraaddons/ (NO hyphen) — this is the
      # directory actually listed in odoo.conf's addons_path. Dockerfile.odoo
      # COPYs the module into /opt/bitnami/odoo/extra-addons/ (WITH hyphen)
      # then does a one-time `cp -r` into the no-hyphen directory at build
      # time only; a bind mount on the hyphenated path (as originally set up
      # here) is never read by Odoo at all and has zero effect.
      - ./odoo-fraud-module/g2p_fraud_detection:/opt/bitnami/odoo/extraaddons/odoo-fraud-module/g2p_fraud_detection
    networks:
      - openg2p-internal
  # ═══════════════════════════════════════════════════════════
  # FRAUD ENGINE — Nouveaux services
  # ═══════════════════════════════════════════════════════════

  fraud-db:
    image: postgres:15-alpine
    container_name: fraud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fraud_engine
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: ${FRAUD_DB_PASSWORD:-fraud123}
    volumes:
      - fraud_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_engine"]
      interval: 10s
      timeout: 5s
      retries: 3
  fraud-engine:
    build:
      context: ./fraud-detection-engine
      dockerfile: Dockerfile
    container_name: fraud-engine
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      OPENG2P_DB_URL: postgresql://${POSTGRES_USER:-odoo}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-openg2p}
      FEATURE_STORE_URL: postgresql://${FRAUD_DB_USER:-fraud}:${FRAUD_DB_PASSWORD:-fraud123}@fraud-db:5432/fraud_engine
      API_SECRET_KEY: ${API_SECRET_KEY:?set in .env}
      MODELS_DIR: /app/app/models_saved
      RULES_DIR: /app/app/rules/rules
      ENV: development
      ALERT_ODOO_ENABLED: "true"
      ALERT_MIN_RISK_LEVEL: "HIGH"
      FRAUD_API_BASE: "http://localhost:8000/api/v1"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.2:1b"
      OLLAMA_TIMEOUT: "60"
      LLM_LANGUAGE: "fr"
    volumes:
      # Whole app/ bind-mounted (not just rules/models_saved) so that source
      # edits made on the host are never lost to a container recreation
      # again — this happened repeatedly when only a subset of files were
      # copied in ad-hoc via `docker cp` (auth.py, metrics.py,
      # country_reference.py, config.py all got silently wiped on rebuild).
      - ./fraud-detection-engine/app:/app/app
      - ./fraud-detection-engine/ml/scripts:/app/ml/scripts
      - ./fraud-detection-engine/ml/data:/app/ml/data
    depends_on:
      postgresql:
        condition: service_healthy
      fraud-db:
        condition: service_healthy
    networks:
      - openg2p-internal
      - fraud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - fraud-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fraud-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - fraud-net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - fraud-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fraud-net

  dashboard:
    build:
      context: ./fraud-detection-engine
      dockerfile: Dockerfile.dashboard
    container_name: streamlit-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      FRAUD_ENGINE_URL: http://fraud-engine:8000
      FRAUD_API_KEY: ${FRAUD_API_KEY:?set in .env}
      DASHBOARD_TOKEN_SECRET: ${DASHBOARD_TOKEN_SECRET:?set in .env}
    networks:
      - fraud-net
    depends_on:
      - fraud-engine

# ═══════════════════════════════════════════════════════════
# RÉSEAUX
# ═══════════════════════════════════════════════════════════
networks:
  openg2p-internal:
    driver: bridge
    name: openg2p-internal

  fraud-net:
    driver: bridge
    name: fraud-net

# ═══════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════
volumes:
  db-data:
  odoo-data:
  fraud_pgdata:
  grafana_data:
  ollama_data:
    name: poc-v2_ollama_data
  mlflow-data: