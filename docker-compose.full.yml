services:

  # ═══════════════════════════════════════════════════════════
  # POC OpenG2P — Services existants (inchangés)
  # ═══════════════════════════════════════════════════════════

  postgresql:
    image: postgres:15.6
    container_name: openg2p-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openg2p}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-openg2p}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - openg2p-internal

  spar-mapper-api:
    build:
      context: ./openg2p-spar
      dockerfile: Dockerfile.mapper
    container_name: openg2p-spar-mapper-api
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - openg2p-internal

  spar-bene-portal-api:
    build:
      context: ./openg2p-spar
      dockerfile: Dockerfile.bene-portal
    container_name: openg2p-spar-bene-portal-api
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - openg2p-internal

  openg2p-odoo:
    build:
      context: .
      dockerfile: Dockerfile.odoo
    image: openg2p-odoo-stable:17.0
    container_name: openg2p-odoo
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      ODOO_DATABASE_HOST: postgresql
      ODOO_DATABASE_NAME: ${POSTGRES_DB:-openg2p}
      ODOO_DATABASE_USER: ${POSTGRES_USER:-odoo}
      ODOO_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      ODOO_LOAD_DEMO_DATA: "no"
      ODOO_UPDATE: "no"
      ODOO_ADDONS_PATH: "/opt/bitnami/odoo/addons,/opt/bitnami/odoo/extra-addons"
      ODOO_ADMIN_PASSWORD: admin
    volumes:
      - odoo-data:/bitnami/odoo
    networks:
      - openg2p-internal
  # ═══════════════════════════════════════════════════════════
  # FRAUD ENGINE — Nouveaux services
  # ═══════════════════════════════════════════════════════════

  fraud-db:
    image: postgres:15-alpine
    container_name: fraud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fraud_engine
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud123
    volumes:
      - fraud_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_engine"]
      interval: 10s
      timeout: 5s
      retries: 3
  fraud-engine:
    build:
      context: ./fraud-detection-engine
      dockerfile: Dockerfile
    container_name: fraud-engine
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      OPENG2P_DB_URL: postgresql://${POSTGRES_USER:-odoo}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-openg2p}
      FEATURE_STORE_URL: postgresql://fraud:fraud123@fraud-db:5432/fraud_engine
      MODELS_DIR: /app/app/models_saved
      RULES_DIR: /app/app/rules/rules
      ENV: development
      ALERT_ODOO_ENABLED: "true"
      ALERT_MIN_RISK_LEVEL: "HIGH"
      FRAUD_API_BASE: "http://localhost:8000/api/v1"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.2:1b"
      OLLAMA_TIMEOUT: "60"
    volumes:
      - ./fraud-detection-engine/app/rules/rules:/app/app/rules/rules
      - ./fraud-detection-engine/app/models_saved:/app/app/models_saved
    depends_on:
      postgresql:
        condition: service_healthy
      fraud-db:
        condition: service_healthy
    networks:
      - openg2p-internal
      - fraud-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - fraud-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fraud-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fraud-net

  dashboard:
    build:
      context: ./fraud-detection-engine
      dockerfile: Dockerfile.dashboard
    container_name: streamlit-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      FRAUD_ENGINE_URL: http://fraud-engine:8000
      FRAUD_API_KEY: dev-secret-change-in-prod
    networks:
      - fraud-net
    depends_on:
      - fraud-engine

# ═══════════════════════════════════════════════════════════
# RÉSEAUX
# ═══════════════════════════════════════════════════════════
networks:
  openg2p-internal:
    driver: bridge
    name: openg2p-internal

  fraud-net:
    driver: bridge
    name: fraud-net

# ═══════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════
volumes:
  db-data:
  odoo-data:
  fraud_pgdata:
  grafana_data:
  ollama_data:
    name: poc-v2_ollama_data