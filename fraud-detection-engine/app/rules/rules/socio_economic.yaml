version: "1.0"
scenario: "socio_economic_mismatch"
rules:
  - id: "SE001"
    name: "Suspicious PMT Score"
    weight: 0.20
    alert_level: "MEDIUM"
    condition: "pmt_score <= 0.20"
    evidence_template: "PMT score {pmt_score:.2f} is abnormally low (threshold: 0.20)"

  - id: "SE002"
    name: "Income Underreporting Pattern"
    weight: 0.20
    alert_level: "MEDIUM"
    condition: "income_per_person < 50 and nb_programs >= 3"
    evidence_template: "Income per person {income_per_person:.0f} very low while enrolled in {nb_programs} programs"

  - id: "SE003"
    name: "Ghost Household"
    weight: 0.25
    alert_level: "HIGH"
    condition: "household_size >= 8 and income_per_person < 70"
    evidence_template: "Large household ({household_size} members) with very low income per person ({income_per_person:.0f})"
