version: '1.0'
scenario: multi_enrollment
rules:
- id: ME001
  name: Multi programmes
  description: Beneficiary enrolled in 3+ programs simultaneously
  weight: 0.3
  alert_level: MEDIUM
  condition: nb_programs >= 3
  evidence_template: 'Enrolled in {nb_programs} programs simultaneously (threshold:
    4)'
  enabled: true
- id: ME002
  name: Rapid Multi-Enrollment
  description: Many active programs with recent enrollment
  weight: 0.35
  alert_level: HIGH
  condition: nb_active_programs >= 3 and avg_enrollment_days < 180
  evidence_template: '{nb_active_programs} active programs, enrolled {avg_enrollment_days}
    days ago'
