version: "1.0"
scenario: "network_fraud"
rules:
  - id: "NF001"
    name: "Shared Bank Account"
    weight: 0.35
    alert_level: "HIGH"
    condition: "shared_account_count >= 2"
    evidence_template: "Bank account shared with {shared_account_count} other beneficiaries"

  - id: "NF002"
    name: "Shared Phone Number"
    weight: 0.30
    alert_level: "HIGH"
    condition: "shared_phone_count >= 3"
    evidence_template: "Phone number shared with {shared_phone_count} other beneficiaries"

  - id: "NF003"
    name: "Phone and Account Network"
    weight: 0.40
    alert_level: "CRITICAL"
    condition: "shared_phone_count >= 2 and shared_account_count >= 2"
    evidence_template: "Shares both phone and bank account with multiple beneficiaries"

  - id: "NF004"
    name: "High Network Risk Score"
    weight: 0.30
    alert_level: "HIGH"
    condition: "network_risk >= 0.60"
    evidence_template: "Network risk score: {network_risk:.2f} (threshold: 0.60)"

  - id: "NF005"
    name: "OpenG2P Duplicate Flag"
    weight: 0.50
    alert_level: "HIGH"
    condition: "is_dedup_flagged >= 1"
    evidence_template: "Flagged as duplicate by OpenG2P deduplication engine ({dedup_flag_count} membership(s) affected)"

  - id: "NF006"
    name: "Multiple Deduplication Records"
    weight: 0.60
    alert_level: "CRITICAL"
    condition: "dedup_record_count >= 2"
    evidence_template: "Found in {dedup_record_count} formal duplicate records across programs"

  - id: "IDC001"
    name: "Identity Cluster"
    weight: 0.55
    alert_level: "CRITICAL"
    condition: "identity_cluster_count >= 2"
    evidence_template: "Same birthdate and family name as {identity_cluster_count} other beneficiaries (possible identity-cluster fraud)"

  - id: "IDC002"
    name: "Possible Duplicate Identity"
    weight: 0.35
    alert_level: "HIGH"
    condition: "identity_cluster_count >= 1"
    evidence_template: "Shares birthdate and family name with {identity_cluster_count} other beneficiary"

  - id: "IDC003"
    name: "Duplicate National ID"
    flag: "DUPLICATE_NATIONAL_ID"
    weight: 0.35
    alert_level: "HIGH"
    # duplicate_national_id_count is a rule-engine-only signal (synthetic
    # data: ml/scripts/generate_dataset.py s10; production: would need a
    # matching SQL CTE over g2p_reg_id in app/data/extractors.py — not
    # wired yet). Deliberately NOT in ML_FEATURES/training this pass.
    condition: "duplicate_national_id_count > 0"
    evidence_template: "National ID number matches {duplicate_national_id_count} other beneficiary record(s) — possible stolen or reused identity"
